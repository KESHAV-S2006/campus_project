<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIITDM Bus Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="bg-layer" aria-hidden="true"></div>

    <header class="page-header">
        <div>
            <p class="eyebrow">IIITDM Campus Shuttle</p>
            <h1>Sadar Line Board</h1>
        </div>
        <div class="clock" id="clock">--:--:--</div>
    </header>

    <main>
        <div class="tabs" id="routeTabs">
            <button class="tab active" data-route="Institute→Sadar">Institute → Sadar</button>
            <button class="tab" data-route="Sadar→Institute">Sadar → Institute</button>
        </div>

        <section class="board">
            <div class="board-strip">
                <span id="dayLabel">Weekday schedule</span>
                <span id="dateLabel"></span>
            </div>
            <div class="board-rows" id="boardRows">
                <!-- rows injected by script.js -->
            </div>
        </section>

        <p class="note">Seat counts are a demo simulation, not a live feed from the buses. Wire <code>script.js</code>
            up to a real sensor or booking backend to replace it.</p>
    </main>

    <footer>
        <div class="contact">
            <span><strong>Conductor</strong> — Mr. Tilak Singh · 9826346178</span>
            <span><strong>Queries</strong> — Mr. Ganesh Kashyap · 9425155203</span>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
